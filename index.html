<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="theme-color" content="#f97316"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Phoenix Classes"/>
<title>Phoenix Classes</title>
<style>
:root{--bg:#0a0d14;--card:#111827;--border:#1f2937;--text:#f1f5f9;--muted:#6b7280;--accent:#f97316;--accent2:#ea580c;--green:#22c55e;--red:#ef4444;--blue:#3b82f6;--purple:#8b5cf6;--yellow:#eab308;}
.light{--bg:#f8fafc;--card:#ffffff;--border:#e2e8f0;--text:#0f172a;--muted:#64748b;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);font-family:Arial,sans-serif;color:var(--text);font-size:14px;overflow-x:hidden;transition:background .3s,color .3s;}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;z-index:100;height:60px;}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);font-size:9px;gap:2px;padding:4px 0;}
.bn-item.active{color:var(--accent);}
.bn-icon{font-size:18px;}
.main{padding:16px 14px 76px;}
.app-header{background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:16px;padding:18px;margin-bottom:16px;position:relative;overflow:hidden;}
.app-header::before{content:'🔥';position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:44px;opacity:.2;}
.app-header-title{font-size:19px;font-weight:800;color:#fff;}
.app-header-sub{font-size:11px;color:#fed7aa;margin-top:2px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;}
.card-title{font-size:12px;font-weight:800;color:var(--accent);margin-bottom:12px;text-transform:uppercase;letter-spacing:.5px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;}
.stat-num{font-size:20px;font-weight:800;line-height:1;}
.stat-label{font-size:9px;color:var(--muted);margin-top:3px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;}
label{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:5px;display:block;text-transform:uppercase;letter-spacing:.3px;}
input,select,textarea{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;color:var(--text);padding:9px 12px;font-size:13px;outline:none;box-sizing:border-box;font-family:Arial,sans-serif;}
input:focus,select:focus,textarea:focus{border-color:var(--accent);}
.btn{color:#fff;border:none;border-radius:10px;padding:11px 14px;font-size:13px;font-weight:700;cursor:pointer;width:100%;margin-top:8px;font-family:Arial,sans-serif;}
.btn-orange{background:linear-gradient(135deg,#f97316,#ea580c);}
.btn-blue{background:linear-gradient(135deg,#3b82f6,#2563eb);}
.btn-green{background:linear-gradient(135deg,#22c55e,#16a34a);}
.btn-red{background:linear-gradient(135deg,#ef4444,#dc2626);}
.btn-purple{background:linear-gradient(135deg,#8b5cf6,#7c3aed);}
.btn-gray{background:var(--border);color:var(--muted);}
.btn-wa{background:#25d366;}
.btn-sm{color:#fff;border:none;border-radius:7px;padding:5px 10px;font-size:11px;font-weight:700;cursor:pointer;font-family:Arial,sans-serif;}
.chip{display:inline-block;border-radius:20px;padding:5px 12px;font-size:11px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:var(--bg);color:var(--muted);margin:2px;}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent);}
.badge{border-radius:20px;padding:2px 9px;font-size:10px;font-weight:700;display:inline-block;}
table{width:100%;border-collapse:collapse;font-size:12px;}
th{text-align:left;padding:8px 7px;font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;border-bottom:1px solid var(--border);letter-spacing:.3px;}
td{padding:9px 7px;border-bottom:1px solid var(--border);vertical-align:middle;}
.empty{color:var(--muted);text-align:center;padding:24px;font-size:12px;}
.mb{margin-bottom:10px;}
.titem{padding:12px;border-radius:10px;cursor:pointer;margin-bottom:7px;background:var(--bg);border:1.5px solid var(--border);}
.titem.on{border-color:var(--accent);background:rgba(249,115,22,.07);}
.toast{position:fixed;bottom:68px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:9px 18px;border-radius:20px;font-size:12px;font-weight:700;z-index:9999;display:none;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.3);}
.toast.err{background:var(--red);}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.topbar-title{font-size:16px;font-weight:800;color:var(--accent);}
.icon-btn{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:7px 10px;cursor:pointer;font-size:16px;color:var(--text);}
.theme-dot{width:26px;height:26px;border-radius:50%;cursor:pointer;border:3px solid transparent;display:inline-block;margin:3px;}
.theme-dot.on{border-color:var(--text);}
.stu-photo{width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid var(--border);}
.stu-photo-ph{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;flex-shrink:0;}
.bar-wrap{margin-bottom:8px;}
.bar-label{font-size:11px;color:var(--muted);margin-bottom:3px;display:flex;justify-content:space-between;}
.bar-bg{background:var(--border);border-radius:20px;height:9px;overflow:hidden;}
.bar-fill{height:9px;border-radius:20px;}
.pay-item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);}
.pay-amount{font-size:16px;font-weight:800;color:var(--green);}
.pay-date{font-size:10px;color:var(--muted);}
.fee-progress{background:var(--bg);border-radius:10px;padding:10px 12px;margin-bottom:8px;border:1px solid var(--border);}
.toggle{position:relative;width:44px;height:24px;cursor:pointer;}
.toggle input{opacity:0;width:0;height:0;}
.toggle-slider{position:absolute;top:0;left:0;right:0;bottom:0;background:var(--border);border-radius:24px;transition:.3s;}
.toggle-slider:before{content:'';position:absolute;height:18px;width:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s;}
.toggle input:checked+.toggle-slider{background:var(--accent);}
.toggle input:checked+.toggle-slider:before{transform:translateX(20px);}
.day-header{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-radius:10px;padding:8px 12px;font-weight:800;font-size:13px;margin-bottom:8px;}
.setting-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);}
/* ── SPLASH ── */
#splash{position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(135deg,#0a0d14,#1a0e05);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .5s;}
#splash.hide{opacity:0;pointer-events:none;}
.splash-logo{animation:splashPulse 1.5s ease-in-out infinite;}
.splash-ring{width:100px;height:100px;border:3px solid rgba(249,115,22,.3);border-top-color:#f97316;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:20px;}
@keyframes splashPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}

/* ── LOGIN SCREEN ── */
#login-screen{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:linear-gradient(150deg,#0a0d14 0%,#1a0e05 50%,#0d0a1a 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:8000;padding:24px;
  animation:fadeIn .4s ease;
}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
#login-screen::before{
  content:'';position:absolute;top:-100px;left:-80px;
  width:400px;height:400px;border-radius:50%;
  background:radial-gradient(circle,rgba(249,115,22,0.12) 0%,transparent 65%);
  pointer-events:none;
}
#login-screen::after{
  content:'';position:absolute;bottom:-80px;right:-60px;
  width:300px;height:300px;border-radius:50%;
  background:radial-gradient(circle,rgba(139,92,246,0.10) 0%,transparent 65%);
  pointer-events:none;
}
.login-box{
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(249,115,22,0.20);
  border-radius:24px;padding:32px 28px;
  width:100%;max-width:360px;
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  box-shadow:0 24px 64px rgba(0,0,0,0.5),0 0 0 1px rgba(249,115,22,0.10);
  position:relative;z-index:1;
  animation:slideUp .4s cubic-bezier(.22,1,.36,1);
}
@keyframes slideUp{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
.login-box-title{
  font-size:11px;font-weight:800;color:rgba(249,115,22,0.8);
  text-transform:uppercase;letter-spacing:2px;text-align:center;margin-bottom:6px;
}
.login-box-brand{
  font-size:26px;font-weight:800;color:#fff;text-align:center;
  margin-bottom:4px;letter-spacing:-.3px;
}
.login-box-sub{font-size:12px;color:rgba(255,255,255,0.4);text-align:center;margin-bottom:28px;font-weight:600;}
.login-field{margin-bottom:16px;}
.login-field label{font-size:11px;font-weight:800;color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:.8px;display:block;margin-bottom:7px;}
.login-field input{
  width:100%;background:rgba(255,255,255,0.07);
  border:1.5px solid rgba(255,255,255,0.12);
  border-radius:14px;color:#fff;
  padding:13px 16px;font-size:15px;outline:none;
  font-family:inherit;font-weight:600;
  transition:border-color .2s,box-shadow .2s,background .2s;
  letter-spacing:.5px;
}
.login-field input:focus{
  border-color:rgba(249,115,22,0.6);
  box-shadow:0 0 0 3px rgba(249,115,22,0.12);
  background:rgba(255,255,255,0.10);
}
.login-field input::placeholder{color:rgba(255,255,255,0.25);}
.login-btn{
  width:100%;background:linear-gradient(135deg,#f97316,#ea580c);
  color:#fff;border:none;border-radius:14px;
  padding:14px;font-size:15px;font-weight:800;
  cursor:pointer;font-family:inherit;margin-top:8px;
  box-shadow:0 6px 24px rgba(249,115,22,0.40);
  transition:transform .15s,filter .15s;letter-spacing:.2px;
}
.login-btn:active{transform:scale(0.97);filter:brightness(0.93);}
.login-err{
  background:rgba(220,38,38,0.15);border:1px solid rgba(220,38,38,0.35);
  border-radius:10px;padding:10px 14px;
  font-size:12px;font-weight:700;color:#fca5a5;
  text-align:center;margin-top:12px;display:none;
}
.login-hint{font-size:11px;color:rgba(255,255,255,0.25);text-align:center;margin-top:16px;font-weight:600;line-height:1.6;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── ANALYTICS ── */
.chart-bar{display:flex;align-items:flex-end;gap:4px;height:80px;margin:8px 0;}
.chart-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;}
.chart-fill{width:100%;border-radius:4px 4px 0 0;min-height:4px;transition:height .5s;}
.chart-lbl{font-size:8px;color:var(--muted);text-align:center;}
.chart-val{font-size:9px;font-weight:700;}
/* ── NOTIFICATION ── */
.notif-dot{width:8px;height:8px;background:#ef4444;border-radius:50%;position:absolute;top:6px;right:6px;}
.activity-item{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--border);}
.activity-icon{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.activity-text{font-size:12px;color:var(--text);font-weight:600;}
.activity-time{font-size:10px;color:var(--muted);}
/* ── QUICK ACTIONS ── */
.qa-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px;}
.qa-btn{background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:14px 8px;cursor:pointer;text-align:center;transition:all .2s;}
.qa-btn:hover{border-color:var(--accent);background:rgba(249,115,22,.08);}
.qa-icon{font-size:24px;margin-bottom:6px;}
.qa-label{font-size:10px;font-weight:700;color:var(--muted);}
/* ── PROFILE TIMELINE ── */
.timeline{position:relative;padding-left:20px;}
.timeline::before{content:'';position:absolute;left:6px;top:0;bottom:0;width:2px;background:var(--border);}
.tl-item{position:relative;margin-bottom:12px;}
.tl-dot{position:absolute;left:-17px;width:10px;height:10px;border-radius:50%;background:var(--accent);top:4px;}
.tl-text{font-size:11px;color:var(--text);}
.tl-time{font-size:10px;color:var(--muted);}

</style>
</head>

<script>
// ── SYNC BAR ─────────────────────────────────────────────────────
function showSyncBar(msg, isErr) {
  var bar = document.getElementById('syncBar');
  if (!bar) {
    bar = document.createElement('div');
    bar.id = 'syncBar';
    bar.style.cssText = 'position:fixed;top:0;left:0;right:0;padding:8px 14px;font-size:12px;font-weight:700;z-index:9998;text-align:center;transition:all .3s;';
    document.body.appendChild(bar);
  }
  bar.textContent = msg;
  bar.style.background = isErr ? '#ef4444' : '#22c55e';
  bar.style.color = '#fff';
  bar.style.display = 'block';
  clearTimeout(bar._hideTimer);
  bar._hideTimer = setTimeout(function() { bar.style.display = 'none'; }, 3500);
}

// ── FIREBASE API ────────────────────────────────────────────────
var API_URL='https://script.google.com/macros/s/AKfycbwZA0AVGXn-DZikhmTTlv6uDhAvrbobyAKP6e1UYor2f6YYTSmUr-5U_eQ0L813h77U/exec';

// ── LAST SYNC TRACKER ──────────────────────────────────────────
var _lastSyncTime = null;
function setLastSync(){ _lastSyncTime = Date.now(); try{localStorage.setItem('pxLastSync', _lastSyncTime);}catch(e){} }
function getLastSyncText(){
  var t = _lastSyncTime || parseInt(localStorage.getItem('pxLastSync')||'0');
  if(!t) return 'कधीच sync नाही';
  var diff = Math.floor((Date.now()-t)/1000);
  if(diff<60) return diff+' seconds ago';
  if(diff<3600) return Math.floor(diff/60)+' min ago';
  if(diff<86400) return Math.floor(diff/3600)+' hrs ago';
  return Math.floor(diff/86400)+' days ago';
}

// ── NETWORK CHECK ──────────────────────────────────────────────
function isOnline(){ return navigator.onLine; }
window.addEventListener('online',  function(){ showSyncBar('✅ Internet परत आले!', false); });
window.addEventListener('offline', function(){ showSyncBar('⚠️ Internet नाही — changes locally saved आहेत.', true); });

// ── SAFE WRAPPERS ──────────────────────────────────────────────
function safeSync(){
  if(!isOnline()){ toast('Internet नाही! आधी connection check करा.',true); return; }
  if(!confirm('Firebase वर Sync करायचे?\n\nLocal data → Firebase वर जाईल.\n\nConfirm करा.')) return;
  syncToSheets();
}
function safeLoad(){
  if(!isOnline()){ toast('Internet नाही! आधी connection check करा.',true); return; }
  var localCount = DB.students ? DB.students.length : 0;
  var msg = 'Firebase मधून Load करायचे?\n\n';
  if(localCount > 0){
    msg += '⚠️ Warning: Local मध्ये '+localCount+' students आहेत.\nFirebase चा data त्यावर येईल.\n\nLocal backup आधी काढून घ्या!\n\nConfirm करा?';
  } else {
    msg += 'Firebase मधील data local मध्ये load होईल.\n\nConfirm करा?';
  }
  if(!confirm(msg)) return;
  loadFromSheets();
}
function safeClearAll(){
  if(!confirm('⚠️ सर्व data delete होईल!\n\nआधी "Download Local Backup" करा.\n\nProceed करायचे?')) return;
  if(!confirm('🔴 FINAL CONFIRM\n\nसर्व students, attendance, fees, marks delete होतील.\n\nHe undone होणार नाही!')) return;
  clearAll();
}

function syncToSheets(){
  window._blockSync=false;
  window._loadingFromSheets=false;
  if(window._syncingToSheets){return;}
  window._syncingToSheets=true;
  clearTimeout(window._syncLockTimer);
  window._syncLockTimer=setTimeout(function(){window._syncingToSheets=false;},30000);
  showSyncBar('☁️ Firebase ला save करत आहे...',false);
  try{
    var FB_BASE='https://phoenix-classes-5050-default-rtdb.asia-southeast1.firebasedatabase.app/phoenixClasses';
    // boardResults photos वेगळ्या brPhotos node मध्ये save
    var brPhotos={};
    var boardResultsClean=(DB.boardResults||[]).map(function(r,i){
      if(r.photo){brPhotos[i]=r.photo;}
      var rc={};for(var k in r)if(k!=='photo')rc[k]=r[k];
      return rc;
    });
    // Main data — photos आणि brPhotos शिवाय
    var data={
      students:DB.students,
      attendance:DB.attendance,
      marks:DB.marks,
      fees:DB.fees,
      notices:DB.notices||[],
      schedule:DB.schedule||[],
      starStudent:DB.starStudent||null,
      remarks:DB.remarks||{},
      materials:DB.materials||[],
      homework:DB.homework||{},
      timetable:DB.timetable||{},
      boardResults:boardResultsClean,
      updatedAt:Date.now()
    };
    console.log('Main data size:', JSON.stringify(data).length, 'chars');
    // Step 1: Main data PUT
    fetch(FB_BASE+'/main.json',{
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(data)
    }).then(function(r){
      if(!r.ok){r.text().then(function(t){console.error('Main PUT error:',t);});showSyncBar('⚠️ Save failed (main): '+r.status,true);window._syncingToSheets=false;clearTimeout(window._syncLockTimer);return Promise.reject('main');}
      // Step 2: Student photos
      return fetch(FB_BASE+'/photos.json',{
        method:'PUT',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify(DB.photos||{})
      });
    }).then(function(r){
      if(!r||!r.ok){showSyncBar('⚠️ Photos save failed',true);window._syncingToSheets=false;clearTimeout(window._syncLockTimer);return Promise.reject('photos');}
      // Step 3: Board result photos
      return fetch(FB_BASE+'/brPhotos.json',{
        method:'PUT',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify(brPhotos)
      });
    }).then(function(r){
      window._syncingToSheets=false;
      clearTimeout(window._syncLockTimer);

function loadFromSheets(){
  if(window._loadingFromSheets){return;}
  window._loadingFromSheets=true;
  window._blockSync=true;
  showSyncBar('☁️ Firebase मधून load करत आहे...',false);
  var FB_BASE='https://phoenix-classes-5050-default-rtdb.asia-southeast1.firebasedatabase.app/phoenixClasses';
  var mainData=null, photosData=null, brPhotosData=null;

  function applyAndFinish(){
    var ld=mainData;
    if(ld&&ld.students){
      DB.students=ld.students||[];
      DB.attendance=ld.attendance||{};
      DB.marks=ld.marks||{tests:[],data:{}};
      if(ld.fees){
        if(!ld.fees.classFee)ld.fees.classFee={};
        if(!ld.fees.payments)ld.fees.payments={};
        DB.fees=ld.fees;
      }
      if(ld.notices&&ld.notices.length>0)DB.notices=ld.notices;
      else if(!DB.notices)DB.notices=[];
      if(ld.schedule)DB.schedule=ld.schedule;
      if(ld.starStudent!==undefined)DB.starStudent=ld.starStudent;
      if(ld.remarks)DB.remarks=ld.remarks;
      if(ld.materials)DB.materials=ld.materials;
      else if(!DB.materials)DB.materials=[];
      if(ld.homework)DB.homework=ld.homework;
      else if(!DB.homework)DB.homework={};
      if(ld.timetable)DB.timetable=ld.timetable;
      // Photos — वेगळ्या node मधून load
      if(photosData)DB.photos=photosData;
      // boardResults — brPhotos परत मेर्ज करा
      if(ld.boardResults){
        DB.boardResults=ld.boardResults.map(function(r,i){
          var rc={};for(var k in r)rc[k]=r[k];
          if(brPhotosData&&brPhotosData[i])rc.photo=brPhotosData[i];
          return rc;
        });
      } else if(!DB.boardResults)DB.boardResults=[];
      dbS();
      window._blockSync=false;
      window._loadingFromSheets=false;
      render();
      showSyncBar('✅ Synced! '+DB.students.length+' students.',false);
    } else {
      // /main.json madhe students nahi — root node try karo (old format fallback)
      showSyncBar('🔄 Root node check करत आहे...',false);
      fetch(FB_BASE+'.json')
        .then(function(r){return r.json();})
        .then(function(rootData){
          if(rootData&&rootData.students){
            // Root node la direct students ahet (very old format)
            mainData=rootData;
            if(rootData.photos){photosData=rootData.photos;}
            if(rootData.brPhotos){brPhotosData=rootData.brPhotos;}
            applyAndFinish();
          } else if(rootData&&rootData.main&&rootData.main.students){
            // /main sub-node madhe data ahe
            mainData=rootData.main;
            if(rootData.photos){photosData=rootData.photos;}
            if(rootData.brPhotos){brPhotosData=rootData.brPhotos;}
            applyAndFinish();
          } else {
            window._blockSync=false;
            window._loadingFromSheets=false;
            showSyncBar('⚠️ Firebase मध्ये valid data नाही.',false);
          }
        }).catch(function(){
          window._blockSync=false;
          window._loadingFromSheets=false;
          showSyncBar('⚠️ Firebase load failed.',true);
        });
    }
  }

  // Load main data
  fetch(FB_BASE+'/main.json')
    .then(function(r){return r.json();})
    .then(function(d){
      // Old structure fallback: if /main doesn’t have students, try root
      if(d&&d.students){
        mainData=d;
      } else {
        // Old format — root node madhe direct hota
        mainData=d;
      }
      return fetch(FB_BASE+'/photos.json');
    }).then(function(r){return r.json();})
    .then(function(d){
      photosData=d||{};
      return fetch(FB_BASE+'/brPhotos.json');
    }).then(function(r){return r.json();})
    .then(function(d){
      brPhotosData=d||{};
      applyAndFinish();
    }).catch(function(err){
      window._loadingFromSheets=false;
      window._blockSync=false;
      showSyncBar('❌ Load failed: '+err.message,true);
    });
}

  window._syncTimer=setTimeout(function(){

    syncToSheets();
  },2000); // 2 sec debounce
}

// ── SMART PHOTO COMPRESS ──────────────────────────────────────
// Quality न बिघडवता 500KB च्या आत compress करतो
function compressPhoto(file, maxSizeKB, maxWidth, callback){
  var reader = new FileReader();
  reader.onload = function(ev){
    var img = new Image();
    img.onload = function(){
      var canvas = document.createElement('canvas');
      var w = img.width, h = img.height;
      // Max width resize (aspect ratio maintain)
      if(w > maxWidth){ h = Math.round(h * maxWidth / w); w = maxWidth; }
      canvas.width = w; canvas.height = h;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      // Quality iterate करत compress करतो — 0.92 पासून 0.60 पर्यंत
      var quality = 0.92;
      var result = canvas.toDataURL('image/jpeg', quality);
      function tryCompress(){
        var sizeKB = Math.round(result.length * 0.75 / 1024);
        if(sizeKB <= maxSizeKB || quality <= 0.60){
          callback(result, sizeKB);
        } else {
          quality -= 0.06;
          result = canvas.toDataURL('image/jpeg', quality);
          tryCompress();
        }
      }
      tryCompress();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

// ── FEE HELPERS ───────────────────────────────────────────────────
function getTotalPaid(sid){
  var pays=DB.fees.payments[sid]||[];
  return pays.reduce(function(s,p){return s+(+p.amount||0);},0);
}
function getYearlyFee(cls,subject,sid){
  // If student has a custom fee (Vacation batch), use that
  if(sid){
    var stu=DB.students.find(function(s){return s.id===sid;});
    if(stu&&stu.batchType==='Vacation'&&stu.customFee>0)return stu.customFee;
  }
  var cf=DB.fees.classFee||{};
  if(!cls)return 0;
  if(subject){
    // Exact match: "Class 8 Semi-English - Maths" (full key as stored in DB)
    var key1=cls+' - '+subject;
    if(cf[key1]>0)return cf[key1];
    // cls already includes medium (e.g. "Class 8 Semi-English"), subject e.g. "Maths"
    // DB key format: "Class 8 Semi-English - Maths"
    var key2=cls+' - '+subject;
    if(cf[key2]>0)return cf[key2];
    // Without medium: base class + subject
    var base=cls.replace(' Semi-English','').replace(' Marathi','').trim();
    var key3=base+' - '+subject;
    if(cf[key3]>0)return cf[key3];
  }
  // Just class name
  if(cf[cls]>0)return cf[cls];
  return 0;
}
function getBalance(sid,cls,subject){
  return getYearlyFee(cls,subject,sid)-getTotalPaid(sid);
}
function getTotalCollected(){

function getBadges(sid,cls){
  var badges=[];
  var pays=DB.fees.payments[sid]||[];
  var totalPaid=getTotalPaid(sid);
  var yearlyFee=getYearlyFee(cls);
  // Fee clear badge
  if(yearlyFee>0&&totalPaid>=yearlyFee)badges.push({icon:'💰',label:'Fee Clear',color:'#22c55e'});
  // Attendance badges
  var attD=0,attP=0;
  for(var k in DB.attendance){var kCls=k.split('_').slice(1).join('_');if(kCls===cls||kCls.indexOf(cls)>=0||cls.indexOf(kCls)>=0){var r=DB.attendance[k];if(r[sid]){attD++;if(r[sid]==='P')attP++;}}}
  var attPct=attD>0?Math.round((attP/attD)*100):0;
  if(attPct===100&&attD>0)badges.push({icon:'📅',label:'Perfect Attendance',color:'#3b82f6'});
  if(attPct>=90&&attD>0)badges.push({icon:'🌟',label:'Star Attendance',color:'#6366f1'});
  // Academic badges
  var tests=(DB.marks.tests||[]).filter(function(t){return t.cls===cls;});
  var md=DB.marks.data||{};
  var totM=0,obtM=0,passCount=0;
  tests.forEach(function(t){var v=Number((md[t.id]||{})[sid]||0);if(v){totM+=t.maxMarks;obtM+=v;if((v/t.maxMarks)*100>=40)passCount++;}});
  var avgPct=totM>0?Math.round((obtM/totM)*100):0;
  if(avgPct>=75)badges.push({icon:'🥇',label:'Top Scorer',color:'#f59e0b'});
  else if(avgPct>=60)badges.push({icon:'🥈',label:'Good Performer',color:'#94a3b8'});
  if(passCount>=3)badges.push({icon:'🔥',label:'Consistent',color:'#f97316'});
  // Star student badge
  if(DB.starStudent&&String(DB.starStudent.id)===String(sid))badges.push({icon:'⭐',label:'Star Student',color:'#eab308'});
  return badges;
}

function pgStu(){

  var q = sSr.trim().toLowerCase();

    if(sF !== 'All' && s.cls !== sF && s.cls.indexOf(sF) < 0) return false;
    if(!q) return true;
    // Name
    if(s.name.toLowerCase().indexOf(q) >= 0) return true;
    // Phone
    if(s.phone && String(s.phone).indexOf(q) >= 0) return true;
    // Class
    if(s.cls && s.cls.toLowerCase().indexOf(q) >= 0) return true;
    // Subject
    if(s.subject && s.subject.toLowerCase().indexOf(q) >= 0) return true;
    // Fee status keywords
    var paid = getTotalPaid(s.id), fee = getYearlyFee(s.cls, s.subject, s.id), bal = fee - paid;
    if(q === 'due' || q === 'pending') return bal > 0;
    if(q === 'paid' || q === 'clear') return fee > 0 && bal <= 0;
    // Batch type
    if(s.batchType && s.batchType.toLowerCase().indexOf(q) >= 0) return true;
    // Birthday month (e.g. "jan", "feb")
    if(s.birthdate){
      var months=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
      var bm = new Date(s.birthdate).getMonth();
      if(months[bm] && months[bm].indexOf(q) >= 0) return true;
    }
    return false;
  });

      DB.attendance[k][x.id]=s;

  dbSWithSync();render();toast(s==='P'?'All Present!':'All Absent!',false);

    var st=(DB.homework&&DB.homework[k]&&DB.homework[k][s.id])||'';
    if(st==='Y')hwDone++;
    else if(st==='N')hwMiss++;
  });

  var rows=cs.length===0?'<tr><td colspan="4" class="empty">'+aCl+' मध्ये विद्यार्थी नाहीत.</td></tr>':
    cs.map(function(s){
      var k=aDt+'_'+s.cls;
      var hwSt=((DB.homework&&DB.homework[k]&&DB.homework[k][s.id])||'');
      return '<tr>'+
        '<td>'+photoEl(s.id,s.name)+'</td>'+
        '<td style="font-weight:700">'+esc(s.name)+'<br><span style="font-size:10px;color:var(--muted)">'+s.cls+'</span></td>'+
        '<td>'+(hwSt==='Y'?bdg('पूर्ण','#22c55e'):hwSt==='N'?bdg('नाही','#ef4444'):bdg('—','var(--muted)'))+'</td>'+
        '<td style="display:flex;align-items:center;gap:4px">'+
        '<button class="btn-sm '+(hwSt==='Y'?'btn-green':'btn-gray')+'" onclick="mHW('+s.id+',\'Y\')">✅ पूर्ण</button>'+
        '<button class="btn-sm '+(hwSt==='N'?'btn-red':'btn-gray')+'" onclick="mHW('+s.id+',\'N\')">❌ नाही</button>'+
        '</td></tr>';
    }).join('');

  var missList=cs.filter(function(s){
    var k=aDt+'_'+s.cls;
    return (DB.homework&&DB.homework[k]&&DB.homework[k][s.id])==='N'&&s.phone;
  });
  var alertBtn=missList.length>0?
    '<button class="btn" style="background:#7c3aed;color:#fff;margin-top:6px" onclick="sendHWAlert()">📱 गृहपाठ Alert पाठवा ('+missList.length+')</button>':'';

  return topbar('गृहपाठ')+
    '<div class="mb"><label>दिनांक</label><input type="date" value="'+aDt+'" onchange="aDt=this.value;render()"/></div>'+
    '<div class="mb">'+cps(['All'].concat(CL_FULL),aCl,'setAC')+'</div>'+
    '<div class="card" style="margin-bottom:12px">'+
      '<div style="display:flex;gap:8px;margin-top:4px;flex-wrap:wrap">'+
        '<span style="background:#22c55e22;color:#22c55e;padding:4px 10px;border-radius:20px;font-size:13px">✅ पूर्ण: '+hwDone+'</span>'+
        '<span style="background:#ef444422;color:#ef4444;padding:4px 10px;border-radius:20px;font-size:13px">❌ नाही: '+hwMiss+'</span>'+
        '<span style="background:var(--border);color:var(--muted);padding:4px 10px;border-radius:20px;font-size:13px">— बाकी: '+(cs.length-hwDone-hwMiss)+'</span>'+
      '</div>'+
      alertBtn+
    '</div>'+
    '<div class="card" style="overflow-x:auto">'+
    '<table class="tbl"><thead><tr><th></th><th>विद्यार्थी</th><th>स्थिती</th><th>गृहपाठ</th></tr></thead><tbody>'+rows+'</tbody></table>'+
    '</div>';
}


// ── MARKS ANALYTICS STATE ────────────────────────────────────
var mrkTab = 'entry'; // 'entry' | 'analytics'
var anlCls = 'Class 8 Semi-English';

function pgMrk(){
  var tests=DB.marks.tests||[],md=DB.marks.data||{};

  var tabBtns = '<div style="display:flex;gap:8px;margin-bottom:14px">'+
    '<button class="btn '+(mrkTab==='entry'?'btn-orange':'btn-gray')+'" style="margin-top:0;flex:1;padding:9px" onclick="mrkTab=\'entry\';render()">📝 Entry</button>'+
    '<button class="btn '+(mrkTab==='analytics'?'btn-orange':'btn-gray')+'" style="margin-top:0;flex:1;padding:9px" onclick="mrkTab=\'analytics\';render()">📊 Analytics</button>'+
    '</div>';

  if(mrkTab==='analytics') return topbar('Marks & Results')+tabBtns+pgMrkAnalytics();

  var tlist=tests.length===0?'<div class="empty">No tests yet.</div>':
    tests.map(function(t){
      var sl=DB.students.filter(function(s){return s.cls===t.cls&&(s.subject===t.subject||s.subject==='Both'||t.subject==='Both');});
      var vals=sl.map(function(s){return Number((md[t.id]||{})[s.id]||0);}).filter(function(v){return v>0;});
      var avg=vals.length?(vals.reduce(function(a,b){return a+b;},0)/vals.length).toFixed(1):'—';
      return '<div class="titem '+(selT===t.id?'on':'')+'" style="display:flex;justify-content:space-between;align-items:center">'+
        '<div onclick="selTest('+t.id+')" style="flex:1;cursor:pointer">'+
        '<div style="font-weight:800;font-size:13px">'+esc(t.testName)+'</div>'+
        '<div style="font-size:11px;color:var(--muted);margin-top:3px">'+t.cls+' · '+t.subject+' · '+t.date+' · Avg: '+avg+'/'+t.maxMarks+'</div></div>'+
        '<button class="btn-sm btn-red" onclick="delTest('+t.id+')" style="margin-left:8px;flex-shrink:0">✕</button>'+
        '</div>';
    }).join('');
  var stObj=null;for(var i=0;i<tests.length;i++){if(tests[i].id===selT){stObj=tests[i];break;}}
  var ts=stObj?DB.students.filter(function(s){return s.cls===stObj.cls&&(s.subject===stObj.subject||s.subject==='Both'||stObj.subject==='Both');}):[];
  var mp='<div class="empty">Select a test to enter marks</div>';
  if(stObj){
    var rows=ts.length===0?'<tr><td colspan="5" class="empty">No students.</td></tr>':
      ts.map(function(s,i){
        var val=mEn[s.id];
        var isAbs=(val==='AB'||val==='ab');
        var numVal=(!isAbs&&val!==undefined&&val!=='')?val:'';
        var pct=numVal?(Number(numVal)/stObj.maxMarks)*100:null;
        var g=isAbs?'Absent':pct===null?'—':pct>=75?'A':pct>=60?'B':pct>=40?'C':'D';
        var gc=isAbs?'#94a3b8':g==='A'?'#22c55e':g==='B'?'#3b82f6':g==='C'?'#eab308':g==='D'?'#ef4444':'var(--muted)';
        var absBtnStyle=isAbs?
          'background:#64748b;color:#fff;border:none;border-radius:8px;padding:5px 10px;font-size:11px;font-weight:700;cursor:pointer':
          'background:var(--bg);color:var(--muted);border:1.5px solid var(--border);border-radius:8px;padding:5px 10px;font-size:11px;font-weight:700;cursor:pointer';
        return '<tr>'+
          '<td>'+photoEl(s.id,s.name)+'</td>'+
          '<td style="font-weight:700">'+esc(s.name)+'</td>'+
          '<td><input type="number" style="width:60px;'+(isAbs?'opacity:0.3;pointer-events:none':'')+'" min="0" max="'+stObj.maxMarks+'" value="'+esc(numVal)+'" onchange="mEn['+s.id+']=this.value" placeholder="0" '+(isAbs?'disabled':'')+'/></td>'+
          '<td><button style="'+absBtnStyle+'" onclick="toggleAbsent('+s.id+')">Absent</button></td>'+
          '<td>'+bdg(g,gc)+'</td></tr>';
      }).join('');
    mp='<div style="font-weight:800;font-size:15px;margin-bottom:4px">'+esc(stObj.testName)+'</div>'+
      '<div style="color:var(--muted);font-size:11px;margin-bottom:12px">'+stObj.cls+' · '+stObj.subject+' · Max: '+stObj.maxMarks+'</div>'+
      '<div style="font-size:11px;color:var(--muted);margin-bottom:10px;background:var(--bg);border-radius:8px;padding:8px 10px">'+
      '💡 Absent button दाबा — marks input disabled होईल आणि "Absent" दिसेल</div>'+
      '<div style="overflow-x:auto"><table><thead><tr><th></th><th>Student</th><th>Marks/'+stObj.maxMarks+'</th><th>Absent?</th><th>Grade</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
      (ts.length>0?'<button class="btn btn-green" onclick="saveMrk()">💾 Save Marks</button>':'');
  }
  return topbar('Marks & Results')+tabBtns+
    '<div class="card"><div class="card-title">➕ New Test</div>'+
    '<div class="mb"><label>Test Name</label><input id="tn" placeholder="e.g. Unit Test 1"/></div>'+
    '<div class="grid2 mb">'+
    '<div><label>Class</label><select id="tc">'+CL_FULL.map(function(c){return '<option>'+c+'</option>';}).join('')+'</select></div>'+
    '<div><label>Subject</label><select id="tsu">'+SB.map(function(s){return '<option>'+s+'</option>';}).join('')+'</select></div></div>'+
    '<div class="grid2 mb"><div><label>Max Marks</label><input type="number" id="tm" value="100"/></div>'+
    '<div><label>Date</label><input type="date" id="td" value="'+aDt+'"/></div></div>'+
    '<button class="btn btn-orange" onclick="addT()">Create Test</button></div>'+
    '<div class="card"><div class="card-title">📝 All Tests</div>'+tlist+'</div>'+
    '<div class="card">'+mp+'</div>';
}

function pgMrkAnalytics(){
  var tests=DB.marks.tests||[],md=DB.marks.data||{};
  var clsTests=tests.filter(function(t){return t.cls===anlCls;});
  var clsStudents=DB.students.filter(function(s){return s.cls===anlCls;});

  if(!clsTests.length) return '<div class="card"><div class="card-title">📊 Analytics</div>'+
    '<div class="mb">'+cps(CL_FULL,anlCls,'setAnlCls')+'</div>'+
    '<div class="empty">या class साठी अजून कोणताही test नाही.</div></div>';

  // ── Class Summary Stats ───────────────────────────────────────
  var allAvgs = clsStudents.map(function(s){
    var tv=clsTests.filter(function(t){return s.subject===t.subject||s.subject==='Both'||t.subject==='Both';});
    var tot=0,obt=0;
    tv.forEach(function(t){var v=Number((md[t.id]||{})[s.id]||0);if(v){tot+=t.maxMarks;obt+=v;}});
    return tot>0?Math.round((obt/tot)*100):null;
  }).filter(function(v){return v!==null;});
  var classAvg = allAvgs.length ? Math.round(allAvgs.reduce(function(a,b){return a+b;},0)/allAvgs.length) : 0;
  var highest = allAvgs.length ? Math.max.apply(null,allAvgs) : 0;
  var lowest  = allAvgs.length ? Math.min.apply(null,allAvgs) : 0;
  var passCount = allAvgs.filter(function(v){return v>=40;}).length;
  var passRate = allAvgs.length ? Math.round((passCount/allAvgs.length)*100) : 0;
  var aCount = allAvgs.filter(function(v){return v>=75;}).length;
  var sorted = allAvgs.slice().sort(function(a,b){return a-b;});
  var median = sorted.length ? sorted[Math.floor(sorted.length/2)] : 0;

  var summaryCards =
    '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px">'+
    '<div style="background:var(--card);border:1px solid var(--border);border-top:3px solid #3b82f6;border-radius:12px;padding:10px;text-align:center">'+
      '<div style="font-size:22px;font-weight:800;color:#3b82f6">'+classAvg+'%</div><div style="font-size:9px;color:var(--muted);font-weight:700;text-transform:uppercase">Class Avg</div></div>'+
    '<div style="background:var(--card);border:1px solid var(--border);border-top:3px solid #22c55e;border-radius:12px;padding:10px;text-align:center">'+
      '<div style="font-size:22px;font-weight:800;color:#22c55e">'+highest+'%</div><div style="font-size:9px;color:var(--muted);font-weight:700;text-transform:uppercase">Highest</div></div>'+
    '<div style="background:var(--card);border:1px solid var(--border);border-top:3px solid #ef4444;border-radius:12px;padding:10px;text-align:center">'+
      '<div style="font-size:22px;font-weight:800;color:#ef4444">'+lowest+'%</div><div style="font-size:9px;color:var(--muted);font-weight:700;text-transform:uppercase">Lowest</div></div>'+
    '<div style="background:var(--card);border:1px solid var(--border);border-top:3px solid #22c55e;border-radius:12px;padding:10px;text-align:center">'+
      '<div style="font-size:22px;font-weight:800;color:#22c55e">'+passRate+'%</div><div style="font-size:9px;color:var(--muted);font-weight:700;text-transform:uppercase">Pass Rate</div></div>'+
    '<div style="background:var(--card);border:1px solid var(--border);border-top:3px solid #eab308;border-radius:12px;padding:10px;text-align:center">'+
      '<div style="font-size:22px;font-weight:800;color:#eab308">'+median+'%</div><div style="font-size:9px;color:var(--muted);font-weight:700;text-transform:uppercase">Median</div></div>'+
    '<div style="background:var(--card);border:1px solid var(--border);border-top:3px solid #f97316;border-radius:12px;padding:10px;text-align:center">'+
      '<div style="font-size:22px;font-weight:800;color:#f97316">'+aCount+'</div><div style="font-size:9px;color:var(--muted);font-weight:700;text-transform:uppercase">Grade A</div></div>'+
    '</div>';

  // ── Class Average Trend (bar chart per test) ──────────────────
  var maxBar = 80;
  var trendBars = clsTests.map(function(t){
    var sl=clsStudents.filter(function(s){return s.subject===t.subject||s.subject==='Both'||t.subject==='Both';});
    var vals=sl.map(function(s){return Number((md[t.id]||{})[s.id]||0);}).filter(function(v){return v>0;});
    var avg=vals.length?(vals.reduce(function(a,b){return a+b;},0)/vals.length):0;
    var pct=t.maxMarks>0?Math.round((avg/t.maxMarks)*100):0;
    var h=Math.max(Math.round((pct/100)*maxBar),3);
    var col=pct>=75?'#22c55e':pct>=60?'#3b82f6':pct>=40?'#eab308':'#ef4444';
    var short=t.testName.length>7?t.testName.slice(0,7)+'…':t.testName;
    return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px">'+
      '<div style="font-size:9px;font-weight:700;color:'+col+'">'+pct+'%</div>'+
      '<div style="width:100%;background:var(--border);border-radius:4px 4px 0 0;height:'+maxBar+'px;display:flex;align-items:flex-end">'+
      '<div style="width:100%;height:'+h+'px;background:'+col+';border-radius:4px 4px 0 0"></div></div>'+
      '<div style="font-size:8px;color:var(--muted);text-align:center;max-width:44px;word-break:break-word;line-height:1.2">'+esc(short)+'</div>'+
      '</div>';
  }).join('');

  // ── Subject Comparison (Maths vs Science) ─────────────────────
  var mathTests  = clsTests.filter(function(t){return t.subject==='Maths'||t.subject==='Both';});
  var sciTests   = clsTests.filter(function(t){return t.subject==='Science'||t.subject==='Both';});
  function subjectAvg(subTests, subName){
    var tot=0,obt=0,cnt=0;
    subTests.forEach(function(t){
      clsStudents.forEach(function(s){
        if(s.subject===subName||s.subject==='Both'){
          var v=Number((md[t.id]||{})[s.id]||0);
          if(v){tot+=t.maxMarks;obt+=v;cnt++;}
        }
      });
    });
    return tot>0?Math.round((obt/tot)*100):0;
  }
  var mathAvg=subjectAvg(mathTests,'Maths');
  var sciAvg=subjectAvg(sciTests,'Science');
  var subjectComp = (mathTests.length&&sciTests.length)?
    '<div class="card">'+
    '<div class="card-title">⚖️ Subject Comparison</div>'+
    '<div style="margin-bottom:10px">'+
      '<div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:4px">'+
        '<span style="color:#3b82f6">📐 Maths</span><span style="color:#3b82f6">'+mathAvg+'%</span></div>'+
      '<div style="background:var(--border);border-radius:20px;height:12px">'+
        '<div style="width:'+mathAvg+'%;background:#3b82f6;border-radius:20px;height:12px"></div></div>'+
    '</div>'+
    '<div>'+
      '<div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:4px">'+
        '<span style="color:#22c55e">🔬 Science</span><span style="color:#22c55e">'+sciAvg+'%</span></div>'+
      '<div style="background:var(--border);border-radius:20px;height:12px">'+
        '<div style="width:'+sciAvg+'%;background:#22c55e;border-radius:20px;height:12px"></div></div>'+
    '</div>'+
    '<div style="font-size:11px;color:var(--muted);margin-top:10px;text-align:center">'+
      (mathAvg>sciAvg?'📐 Maths class average जास्त आहे':sciAvg>mathAvg?'🔬 Science class average जास्त आहे':'📐🔬 दोन्ही समान आहे')+
    '</div></div>' : '';

  // ── Grade Distribution (latest test) ─────────────────────────
  var lastTest=clsTests[clsTests.length-1];
  var lastSl=clsStudents.filter(function(s){return s.subject===lastTest.subject||s.subject==='Both'||lastTest.subject==='Both';});
  var grades={A:0,B:0,C:0,D:0,Absent:0};
  lastSl.forEach(function(s){
    var v=(md[lastTest.id]||{})[s.id];
    if(v==='AB'){grades.Absent++;return;}
    var n=Number(v||0);if(!n){grades.Absent++;return;}
    var pct=Math.round((n/lastTest.maxMarks)*100);
    if(pct>=75)grades.A++;else if(pct>=60)grades.B++;else if(pct>=40)grades.C++;else grades.D++;
  });
  var total=lastSl.length||1;
  var gradeBars=[{g:'A',c:'#22c55e'},{g:'B',c:'#3b82f6'},{g:'C',c:'#eab308'},{g:'D',c:'#ef4444'},{g:'Absent',c:'#94a3b8'}].map(function(x){
    var n=grades[x.g],pct=Math.round((n/total)*100);
    return '<div style="margin-bottom:8px">'+
      '<div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px">'+
      '<span style="font-weight:700;color:'+x.c+'">Grade '+x.g+'</span>'+
      '<span style="color:var(--muted)">'+n+' students ('+pct+'%)</span></div>'+
      '<div style="background:var(--border);border-radius:20px;height:10px">'+
      '<div style="width:'+pct+'%;background:'+x.c+';border-radius:20px;height:10px"></div></div></div>';
  }).join('');

  // ── Individual Student Progress (sparkline per student) ───────
  var stuProgressCards = clsStudents.map(function(s){
    var tv=clsTests.filter(function(t){return s.subject===t.subject||s.subject==='Both'||t.subject==='Both';});
    if(!tv.length) return '';
    var pts=tv.map(function(t){
      var v=(md[t.id]||{})[s.id];
      if(v==='AB'||!v) return null;
      return t.maxMarks>0?Math.round((Number(v)/t.maxMarks)*100):null;
    });
    var validPts=pts.filter(function(p){return p!==null;});
    if(!validPts.length) return '';
    var avgP=Math.round(validPts.reduce(function(a,b){return a+b;},0)/validPts.length);
    var lastP=validPts[validPts.length-1];
    var grade=avgP>=75?'A':avgP>=60?'B':avgP>=40?'C':'D';
    var gc=grade==='A'?'#22c55e':grade==='B'?'#3b82f6':grade==='C'?'#eab308':'#ef4444';
    // Sparkline SVG
    var svgW=120,svgH=36,pad=4;
    var xs=pts.map(function(_,i){return pad+i*(svgW-2*pad)/Math.max(pts.length-1,1);});
    var ys=pts.map(function(p){return p===null?null:svgH-pad-Math.round((p/100)*(svgH-2*pad));});
    var pathD='',dotsSVG='';
    var first=true;
    pts.forEach(function(p,i){
      if(p===null) return;
      if(first){pathD+='M '+xs[i]+' '+ys[i];first=false;}
      else pathD+=' L '+xs[i]+' '+ys[i];
      dotsSVG+='<circle cx="'+xs[i]+'" cy="'+ys[i]+'" r="3" fill="'+gc+'"/>';
    });
    // Trend arrow
    var trendIcon='→';var trendCol='#6b7280';
    if(validPts.length>=2){
      var diff=validPts[validPts.length-1]-validPts[validPts.length-2];
      if(diff>3){trendIcon='↑';trendCol='#22c55e';}
      else if(diff<-3){trendIcon='↓';trendCol='#ef4444';}
    }
    return '<div style="background:var(--bg);border:1.5px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px;display:flex;align-items:center;gap:10px">'+
      '<div style="flex:1;min-width:0">'+
        '<div style="font-weight:700;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(s.name)+'</div>'+
        '<div style="font-size:10px;color:var(--muted)">'+esc(s.subject)+' · '+validPts.length+' tests</div>'+
      '</div>'+
      '<svg width="'+svgW+'" height="'+svgH+'" style="flex-shrink:0">'+
        (pathD?'<path d="'+pathD+'" fill="none" stroke="'+gc+'" stroke-width="2" stroke-linejoin="round"/>':'')+
        dotsSVG+
      '</svg>'+
      '<div style="text-align:center;flex-shrink:0;min-width:44px">'+
        '<div style="font-size:16px;font-weight:800;color:'+gc+'">'+avgP+'%</div>'+
        '<div style="font-size:13px;font-weight:800;color:'+trendCol+'">'+trendIcon+'</div>'+
      '</div>'+
    '</div>';
  }).join('');

  // ── Top 3 & Needs Attention ───────────────────────────────────
  var stuAvgs=clsStudents.map(function(s){
    var tv=clsTests.filter(function(t){return s.subject===t.subject||s.subject==='Both'||t.subject==='Both';});
    var tot=0,obt=0;
    tv.forEach(function(t){var v=Number((md[t.id]||{})[s.id]||0);if(v){tot+=t.maxMarks;obt+=v;}});
    return{s:s,avg:tot>0?Math.round((obt/tot)*100):0,tests:tv.length};
  }).filter(function(x){return x.tests>0;}).sort(function(a,b){return b.avg-a.avg;});

  var top3=stuAvgs.slice(0,3).map(function(x,i){
    var medal=i===0?'🥇':i===1?'🥈':'🥉';
    return '<div style="display:flex;align-items:center;gap:8px;padding:8px;background:var(--bg);border-radius:8px;margin-bottom:6px">'+
      '<span style="font-size:20px">'+medal+'</span>'+
      '<div style="flex:1"><div style="font-weight:700;font-size:12px">'+esc(x.s.name)+'</div>'+
      '<div style="font-size:10px;color:var(--muted)">'+x.s.subject+'</div></div>'+

function pgFeeHistory(){
  var fl=DB.students.filter(function(s){return fCl==='All'||s.cls===fCl||s.cls.indexOf(fCl)>=0;});
  var items=[];
  fl.forEach(function(s){
    (DB.fees.payments[s.id]||[]).forEach(function(p,idx){
      items.push({stu:s,payment:p,idx:idx});
    });
  });
  items.sort(function(a,b){return b.payment.date.localeCompare(a.payment.date);});
  var rows=items.length===0?'<div class="empty">No payments recorded yet.</div>':
    items.map(function(item){
      var s=item.stu,p=item.payment,idx=item.idx;
      var rcNo = p.receiptNo || ('RC-'+item.idx.toString().padStart(4,'0'));
      return '<div class="pay-item">'+
        '<div style="display:flex;gap:10px;align-items:center">'+photoEl(s.id,s.name)+
        '<div><div style="font-weight:700">'+esc(s.name)+'</div>'+
        '<div style="font-size:10px;color:var(--muted)">'+s.cls+' · '+fmtDate(p.date)+(p.note?' · '+esc(p.note):'')+'</div>'+
        '<div style="font-size:9px;color:var(--accent);font-weight:700">'+rcNo+'</div></div></div>'+
        '<div style="display:flex;align-items:center;gap:6px">'+
        '<div class="pay-amount">₹'+p.amount+'</div>'+
        '<button class="btn-sm" style="background:#3b82f6;font-size:10px;padding:4px 7px" onclick="openHistoryReceipt('+s.id+','+idx+')">🧾</button>'+
        '<button class="btn-sm btn-red" onclick="delPay('+s.id+','+idx+');feeTab=\'history\'">✕</button>'+
        '</div></div>';

// ── ADMIN LOGIN (Firebase-verified — no password in HTML) ──────
var SESSION_KEY = 'pcAdminAuth';
var AUTH_FB = 'https://phoenix-classes-5050-default-rtdb.asia-southeast1.firebasedatabase.app/adminAuth.json';

// Brute-force protection
var _loginAttempts = 0;
var _loginLocked = false;
var _loginLockTimer = null;

function isLoggedIn(){
  return sessionStorage.getItem(SESSION_KEY) === 'yes';
}

function setLoginLoading(on){
  var btn = document.getElementById('login-btn');
  var inp = document.getElementById('admin-pass');
  if(btn) btn.textContent = on ? '⏳ Verifying...' : 'Login →';
  if(inp) inp.disabled = on;
  if(btn) btn.disabled = on;
}

function showLoginErr(msg){
  var err = document.getElementById('login-err');
  if(err){ err.textContent = msg; err.style.display='block'; }
  var inp = document.getElementById('admin-pass');
  if(inp){ inp.style.borderColor='rgba(220,38,38,0.6)'; inp.value=''; inp.focus(); }
  setTimeout(function(){
    if(err) err.style.display='none';
    if(inp) inp.style.borderColor='';
  }, 3000);
}

function doAdminLogin(){
  if(_loginLocked){ showLoginErr('❌ खूप attempts! 30 seconds थांबा.'); return; }
  var inp = document.getElementById('admin-pass');
  if(!inp || !inp.value.trim()) return;
  var typed = inp.value.trim();

  // Rate limit: 5 attempts → 30 sec lockout
  _loginAttempts++;
  if(_loginAttempts >= 5){
    _loginLocked = true;
    showLoginErr('❌ खूप attempts! 30 seconds थांबा.');
    clearTimeout(_loginLockTimer);
    _loginLockTimer = setTimeout(function(){ _loginLocked=false; _loginAttempts=0; }, 30000);
    return;
  }

  if(!navigator.onLine){ showLoginErr('❌ Internet नाही! Connect करा.'); return; }

  setLoginLoading(true);

  // Hash the typed password with SHA-256, then compare with Firebase stored hash
  crypto.subtle.digest('SHA-256', new TextEncoder().encode(typed))
    .then(function(hashBuf){
      var hashArr = Array.from(new Uint8Array(hashBuf));
      var hashHex = hashArr.map(function(b){return b.toString(16).padStart(2,'0');}).join('');
      return fetch(AUTH_FB).then(function(r){ return r.json(); }).then(function(stored){
        return { typed: hashHex, stored: stored };
      });
    })
    .then(function(res){
      setLoginLoading(false);
      if(res.stored && res.stored.hash === res.typed){
        // ✅ Match
        _loginAttempts = 0;
        sessionStorage.setItem(SESSION_KEY,'yes');
        var ls = document.getElementById('login-screen');
        if(ls){ ls.style.opacity='0'; ls.style.transition='opacity .3s'; setTimeout(function(){ls.style.display='none';ls.style.opacity='';},300); }
        startApp();
      } else {
        showLoginErr('❌ Incorrect password. Try again. ('+_loginAttempts+'/5)');
      }
    })
    .catch(function(e){
      setLoginLoading(false);
      showLoginErr('❌ Firebase शी connect होता आले नाही. Internet check करा.');
    });
}

function doAdminLogout(){
  sessionStorage.removeItem(SESSION_KEY);
  location.reload();
}

// ── CHANGE PASSWORD (Settings मधून) ────────────────────────────
function changePassword(){
  var cur = prompt('सध्याचा password टाका:');
  if(!cur) return;
  var nw  = prompt('नवीन password टाका (min 8 chars):');
  if(!nw || nw.length < 8){ toast('Password खूप छोटा आहे! (min 8 chars)',true); return; }
  var cf  = prompt('नवीन password पुन्हा टाका:');
  if(nw !== cf){ toast('Passwords जुळत नाहीत!',true); return; }
  if(!navigator.onLine){ toast('Internet नाही!',true); return; }

  // Hash current password and verify first
  crypto.subtle.digest('SHA-256', new TextEncoder().encode(cur))
    .then(function(h){
      var curHash = Array.from(new Uint8Array(h)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
      return fetch(AUTH_FB).then(function(r){return r.json();}).then(function(stored){
        if(!stored || stored.hash !== curHash) throw new Error('wrong_current');
        return crypto.subtle.digest('SHA-256', new TextEncoder().encode(nw));
      });
    })
    .then(function(h){
      var newHash = Array.from(new Uint8Array(h)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
      return fetch(AUTH_FB, {
        method:'PUT',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ hash: newHash, updatedAt: Date.now() })
      });
    })
    .then(function(r){
      if(r.ok) toast('✅ Password बदलला! पुन्हा login करा.',false);
      else toast('❌ Firebase error. Try again.',true);
    })
    .catch(function(e){
      if(e.message==='wrong_current') toast('❌ सध्याचा password चुकीचा आहे!',true);
      else toast('❌ Error: '+e.message,true);
    });
}
function startApp(){
  try {
    dbL();
    initDate();
    applyTheme();
    render();
    window._blockSync = false;
    window._syncingToSheets = false;
    window._loadingFromSheets = false;
    setTimeout(function () {
      if(!DB.students || DB.students.length === 0){
        loadFromSheets();
      }
    }, 800);
    setTimeout(function () {
      var splash = document.getElementById('splash');
      if (splash) {
        splash.classList.add('hide');
        setTimeout(function () { splash.remove(); }, 500);
      }
    }, 2500);
  } catch (e) {
    console.error('Startup Error:', e);
    var splash = document.getElementById('splash');
    if (splash) splash.style.display = 'none';
  }
}

// ── APP STARTUP (single init — duplicate removed to fix double-load bug) ──
window.addEventListener('load', function () {
  if(isLoggedIn()){
    // Already logged in — directly start app
    startApp();
  } else {
    // Show login screen, hide splash after short delay
    setTimeout(function(){
      var splash = document.getElementById('splash');
      if(splash){ splash.classList.add('hide'); setTimeout(function(){splash.remove();},500); }
      var ls = document.getElementById('login-screen');
      if(ls) ls.style.display='flex';
      setTimeout(function(){ var i=document.getElementById('admin-pass'); if(i)i.focus(); },600);
    }, 1200);
  }
});
</script>
