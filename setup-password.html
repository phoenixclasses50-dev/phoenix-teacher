<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Phoenix Classes — Password Setup</title>
<style>
body{font-family:Arial,sans-serif;background:#0a0d14;color:#f1f5f9;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:20px;box-sizing:border-box;}
.box{background:#111827;border:1px solid #1f2937;border-radius:16px;padding:28px;width:100%;max-width:380px;}
h2{color:#f97316;margin:0 0 6px;font-size:18px;}
p{color:#6b7280;font-size:12px;margin:0 0 20px;line-height:1.6;}
label{font-size:11px;font-weight:700;color:#6b7280;display:block;margin-bottom:5px;text-transform:uppercase;}
input{width:100%;background:#0a0d14;border:1.5px solid #1f2937;border-radius:10px;color:#f1f5f9;padding:10px 12px;font-size:14px;outline:none;box-sizing:border-box;margin-bottom:14px;}
input:focus{border-color:#f97316;}
button{width:100%;background:linear-gradient(135deg,#f97316,#ea580c);color:#fff;border:none;border-radius:10px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;}
.msg{border-radius:10px;padding:12px;font-size:12px;font-weight:700;margin-top:14px;display:none;}
.msg.ok{background:rgba(34,197,94,0.15);color:#22c55e;border:1px solid #22c55e;}
.msg.err{background:rgba(239,68,68,0.15);color:#ef4444;border:1px solid #ef4444;}
.warning{background:rgba(249,115,22,0.1);border:1px solid rgba(249,115,22,0.3);border-radius:10px;padding:12px;font-size:11px;color:#fed7aa;margin-bottom:16px;line-height:1.6;}
</style>
</head>
<body>
<div class="box">
  <h2>🔐 Password Setup</h2>
  <p>Phoenix Classes Admin Password Firebase मध्ये secure set करा.<br>हे page एकदाच वापरा — नंतर delete करा.</p>
  <div class="warning">
    ⚠️ हे page फक्त <b>एकदाच</b> वापरा.<br>
    Password set झाल्यावर हा file delete करा.
  </div>
  <label>नवीन Password</label>
  <input type="password" id="pw1" placeholder="Enter new password (min 8 chars)"/>
  <label>Confirm Password</label>
  <input type="password" id="pw2" placeholder="Repeat password"/>
  <button onclick="setPass()">🔑 Firebase मध्ये Set करा</button>
  <div class="msg" id="msg"></div>
</div>
<script>
var FB_AUTH = 'https://phoenix-classes-5050-default-rtdb.asia-southeast1.firebasedatabase.app/adminAuth.json';
function showMsg(txt, ok){
  var m = document.getElementById('msg');
  m.textContent = txt; m.className = 'msg '+(ok?'ok':'err'); m.style.display='block';
}
async function setPass(){
  var p1 = document.getElementById('pw1').value.trim();
  var p2 = document.getElementById('pw2').value.trim();
  if(!p1 || p1.length < 8){ showMsg('Password कमीत कमी 8 characters असावा!', false); return; }
  if(p1 !== p2){ showMsg('Passwords जुळत नाहीत!', false); return; }
  try {
    var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(p1));
    var hash = Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    var r = await fetch(FB_AUTH, {
      method: 'PUT',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ hash, updatedAt: Date.now() })
    });
    if(r.ok){
      showMsg('✅ Password Firebase मध्ये set झाला! हा page आता delete करा.', true);
      document.getElementById('pw1').value='';
      document.getElementById('pw2').value='';
    } else {
      showMsg('❌ Firebase error: '+r.status, false);
    }
  } catch(e){
    showMsg('❌ Error: '+e.message, false);
  }
}
</script>
</body>
</html>
